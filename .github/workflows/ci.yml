name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pydantic-ai: [""]
        include:
          # The declared floor, on the oldest supported Python.
          - python-version: "3.10"
            pydantic-ai: "2.0.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: Install package
        run: uv pip install --system -e ".[dev]"
      - name: Pin the PydanticAI floor
        if: matrix.pydantic-ai != ''
        run: uv pip install --system "pydantic-ai==${{ matrix.pydantic-ai }}"
      - name: Show framework versions
        run: python -c "from importlib.metadata import version as v; print('pydantic-ai', v('pydantic-ai'), 'asqav', v('asqav'))"
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -v

  ci-ok:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - run: echo "CI passed"
